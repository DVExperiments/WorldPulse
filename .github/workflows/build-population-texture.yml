name: Build WorldPulse population texture
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldpulse-population-build
  cancel-in-progress: false
jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install processing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow requests rasterio
      - name: Download measured WorldPop data and build texture
        run: python scripts/build_population_texture.py
      - name: Commit generated texture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/population-density.png assets/population-density-info.json
          if git diff --cached --quiet; then
            echo 'No population texture changes to commit.'
            exit 0
          fi
          git commit -m 'Build measured global population brightness texture'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort || true; exit 1; }
            sleep 3
          done
          exit 1
