name: Refresh geographic news

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

# Only one news-refresh job may update the data branch at a time.
concurrency:
  group: worldpulse-news-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch multi-source global RSS news coverage
        run: python scripts/update.py
      - name: Commit updated snapshot (retry on concurrent push)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/history.json data/source-health.json
          if git diff --cached --quiet; then
            echo 'No news data changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh geographic news snapshot'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'News snapshot pushed successfully.'
              exit 0
            fi
            echo "Push attempt $attempt rejected; incorporating remote changes."
            git fetch origin main
            # When another snapshot updates the same JSON, prefer the new
            # snapshot from this run while retaining unrelated remote edits.
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo 'Cannot safely reconcile the commit; rerun this workflow.'
              exit 1
            fi
            sleep 2
          done
          echo 'Push still rejected after 3 attempts; rerun this workflow.'
          exit 1
