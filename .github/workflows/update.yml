name: Refresh geographic news

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: worldpulse-news-refresh-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh local branch before collection
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "Starting from main at $(git rev-parse --short HEAD)"
      - name: Fetch multi-source global RSS news coverage
        run: python scripts/update.py
      - name: Commit updated snapshot (v1.4A push repair)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/history.json data/source-health.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh geographic news snapshot'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'News snapshot successfully pushed to main.'
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; rebasing on newest origin/main"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo 'Automatic reconciliation failed. No force push performed.'
              exit 1
            fi
            sleep 3
          done
          echo 'Push could not be completed after five retries.'
          exit 1
