name: Build Global Pulse analytics

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh geographic news"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: global-pulse-analytics
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current news snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build derived analytics
        run: python scripts/global_pulse.py
      - name: Save derived analytics to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global-pulse.json
          if ! git diff --cached --quiet; then
            git commit -m "Update derived Global Pulse analytics"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Global Pulse already up to date"
          fi
